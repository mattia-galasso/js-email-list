<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mattia Galasso" />
    <meta name="description" content="Generatore di una lista di mail" />
    <title>Email List</title>

    <!-- ICON -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📧</text></svg>"
    />

    <!-- BOOTSTRAP ICONS -->
    <!-- <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    /> -->

    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- BOOTSTRAP SCRIPT -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- AXIOS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- CUSTOM SCRIPT -->
    <script src="./js/function.js" defer></script>
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="wrapper">
      <header class="my-2 py-2 page-header text-center border-bottom">
        <h1>📧 Generatore di E-Mail Randomiche 📧</h1>
      </header>
      <main class="page-main">
        <div class="my-4 text-center container">
          <!-- ALERT -->
          <div class="d-none alert alert-warning alert-box" id="loading-alert">
            <div class="spinner-border text-danger" role="status"></div>
            <span class="alert-text">CARICAMENTO...</span>
          </div>
          <div class="d-none alert alert-danger alert-box" id="error-alert">
            <span class="alert-text" id="error-text"></span>`
          </div>

          <!-- LISTA MAIL -->
          <div class="d-none card my-4" id="email-list-card">
            <div class="card-header">
              <h2 class="card-title">⬇️ E-mail Generate ⬇️</h2>
            </div>
            <ul class="list-group list-group-flush" id="email-list"></ul>
          </div>

          <!-- FORM -->
          <form id="gen-mail-box">
            <div class="email-number-input">
              <label for="number-input">Quante E-Mail vuoi generare?</label>
              <input
                type="number"
                name="number-input"
                id="number-input"
                value="10"
                min="1"
                max="20"
                required
              />
            </div>
            <button class="btn btn-success" id="gen-button">
              Genera E-Mail
            </button>
          </form>
        </div>
      </main>
      <footer class="page-footer"></footer>
    </div>
  </body>
</html>
